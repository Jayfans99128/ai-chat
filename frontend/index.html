<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荧 - 我的陪伴空间</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #0b0f19;
            --line: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-width: 320px;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 75% 0%, rgba(79,70,229,.13), transparent 38%),
                var(--page);
            color: var(--text);
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        }
        button, textarea, select { font: inherit; }
        button { color: inherit; }
        .container {
            width: min(1440px, 100%);
            height: 100%;
            margin: 0 auto;
            padding: 22px;
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 18px;
        }
        .sidebar, .chat-panel {
            min-width: 0;
            min-height: 0;
            border: 1px solid rgba(148,163,184,.12);
            background: rgba(17,24,39,.92);
            border-radius: 20px;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 4px 8px 22px;
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .02em;
        }
        .brand-icon {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 11px;
            background: linear-gradient(145deg, #4f46e5, #2563eb);
            box-shadow: 0 6px 18px rgba(79,70,229,.28);
            font-size: 17px;
        }
        .profile-card {
            padding: 18px 12px;
            border: 1px solid rgba(148,163,184,.1);
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(30,41,59,.92), rgba(15,23,42,.75));
            text-align: center;
        }
        .avatar {
            display: grid;
            width: 72px;
            height: 72px;
            margin: 0 auto 13px;
            place-items: center;
            border: 1px solid rgba(191,219,254,.35);
            border-radius: 22px;
            background: linear-gradient(145deg, #312e81, #1d4ed8);
            box-shadow: 0 8px 24px rgba(37,99,235,.22);
            font-size: 34px;
            transition: transform .25s, box-shadow .25s;
        }
        .avatar.speaking {
            animation: breathe 1.2s ease-in-out infinite;
        }
        @keyframes breathe {
            50% { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(59,130,246,.4); }
        }
        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .name { max-width: 175px; overflow: hidden; color: var(--text); font-size: 18px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .rename-btn, .icon-btn {
            display: inline-grid;
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: .18s ease;
        }
        .rename-btn { width: 28px; height: 28px; }
        .rename-btn:hover, .icon-btn:hover { border-color: var(--line); background: rgba(148,163,184,.1); color: var(--text); }
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 9px;
            color: var(--muted);
            font-size: 12px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34,197,94,.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 50% { opacity: .45; } }
        .sidebar-label {
            margin: 26px 10px 9px;
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 12px;
            border: 1px solid rgba(96,165,250,.16);
            border-radius: 11px;
            background: rgba(79,70,229,.13);
            color: #bfdbfe;
            font-size: 13px;
        }
        .sidebar-actions {
            display: grid;
            gap: 8px;
            margin-top: auto;
            padding-top: 20px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 11px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            text-align: left;
            transition: .18s ease;
        }
        .action-btn:hover { border-color: var(--line); background: rgba(148,163,184,.08); color: var(--text); }
        .action-btn.danger:hover { border-color: rgba(248,113,113,.22); color: #fca5a5; }
        .chat-panel {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            min-height: 82px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 26px;
            border-bottom: 1px solid rgba(148,163,184,.1);
        }
        .eyebrow {
            display: block;
            margin-bottom: 5px;
            color: #818cf8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .12em;
        }
        .chat-title { color: var(--text); font-size: 18px; font-weight: 650; }
        .connection-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border: 1px solid rgba(34,197,94,.16);
            border-radius: 999px;
            background: rgba(34,197,94,.07);
            color: #86efac;
            font-size: 11px;
            white-space: nowrap;
        }
        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .proactive-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .proactive-control input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }
        .proactive-track {
            position: relative;
            width: 36px;
            height: 20px;
            border: 1px solid #475569;
            border-radius: 999px;
            background: #1e293b;
            transition: background .18s, border-color .18s;
        }
        .proactive-track::after {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #94a3b8;
            content: "";
            transition: transform .18s, background .18s;
        }
        .proactive-control input:checked + .proactive-track {
            border-color: #4f46e5;
            background: #3730a3;
        }
        .proactive-control input:checked + .proactive-track::after {
            transform: translateX(16px);
            background: #fff;
        }
        .proactive-control input:focus-visible + .proactive-track {
            outline: 2px solid #818cf8;
            outline-offset: 3px;
        }
        .chat-box {
            display: flex;
            min-height: 0;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding: 26px clamp(16px, 5vw, 64px);
            scrollbar-color: #334155 transparent;
            scrollbar-width: thin;
        }
        .message {
            position: relative;
            max-width: min(78%, 720px);
            padding: 12px 16px;
            border: 1px solid rgba(148,163,184,.1);
            border-radius: 16px;
            color: #e2e8f0;
            font-size: 14px;
            line-height: 1.75;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .message.bot { align-self: flex-start; border-bottom-left-radius: 5px; background: #1e293b; }
        .message.user {
            align-self: flex-end;
            border-color: rgba(96,165,250,.25);
            border-bottom-right-radius: 5px;
            background: linear-gradient(135deg, #3730a3, #1d4ed8);
            color: #fff;
        }
        .typing-indicator {
            display: flex;
            align-self: flex-start;
            gap: 5px;
            padding: 13px 17px;
            border-radius: 16px 16px 16px 5px;
            background: #1e293b;
        }
        .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: #818cf8; animation: typingBounce 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes typingBounce { 30% { transform: translateY(-6px); } 0%, 60%, 100% { transform: translateY(0); } }
        .composer {
            padding: 14px clamp(14px, 4vw, 40px) max(18px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(148,163,184,.1);
            background: rgba(15,23,42,.62);
        }
        .composer-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .voice-choice {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 9px;
            color: var(--muted);
            font-size: 12px;
        }
        .voice-choice label { display: flex; min-width: 0; align-items: center; gap: 8px; }
        .voice-choice select {
            max-width: min(310px, 54vw);
            padding: 7px 30px 7px 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
            background: #111827;
            color: #cbd5e1;
            font-size: 12px;
        }
        .voice-choice select:focus, .rename-input:focus, .input-area textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.14); }
        .voice-preview-btn {
            padding: 7px 12px;
            border: 1px solid rgba(99,102,241,.35);
            border-radius: 9px;
            background: rgba(79,70,229,.12);
            color: #c7d2fe;
            cursor: pointer;
            font-size: 12px;
            transition: .18s ease;
        }
        .voice-preview-btn:hover:not(:disabled) { border-color: #818cf8; background: rgba(79,70,229,.24); }
        .voice-preview-btn:disabled { opacity: .6; cursor: wait; }
        .voice-status { min-height: 0; color: #fbbf24; font-size: 12px; text-align: center; }
        .voice-status:not(:empty) { padding: 0 0 9px; }
        .input-hint { margin: 0 0 7px; color: #64748b; font-size: 11px; text-align: center; }
        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 9px;
            padding: 7px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: #0f172a;
            transition: border-color .18s, box-shadow .18s;
        }
        .input-area textarea {
            flex: 1;
            min-width: 0;
            min-height: 42px;
            max-height: 120px;
            padding: 10px 11px;
            border: 1px solid transparent;
            border-radius: 9px;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        .input-area textarea::placeholder { color: #64748b; }
        .input-area button {
            display: grid;
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid transparent;
            border-radius: 11px;
            background: #1e293b;
            color: #cbd5e1;
            cursor: pointer;
            transition: .18s ease;
        }
        .input-area button:hover:not(:disabled) { border-color: #475569; background: #334155; }
        .input-area button:disabled { opacity: .5; cursor: not-allowed; }
        .input-area button.mic-listening { background: #991b1b; color: #fecaca; }
        .input-area #sendBtn { background: linear-gradient(145deg, #4f46e5, #2563eb); color: #fff; }
        .input-area #sendBtn:hover:not(:disabled) { box-shadow: 0 4px 15px rgba(59,130,246,.28); }
        .delete-msg-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            z-index: 1;
            padding: 0 4px;
            border: 0;
            border-radius: 4px;
            background: #0f172a;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            opacity: 0;
            transition: .18s ease;
        }
        .message:hover .delete-msg-btn, .delete-msg-btn:focus-visible { opacity: 1; }
        .delete-msg-btn:hover { color: #fca5a5; }
        .rename-dialog {
            width: min(420px, calc(100vw - 32px));
            margin: auto;
            padding: 24px;
            border: 1px solid #334155;
            border-radius: 18px;
            background: #111827;
            color: var(--text);
            box-shadow: 0 24px 80px rgba(0,0,0,.5);
        }
        .rename-dialog::backdrop { background: rgba(2,6,23,.72); backdrop-filter: blur(5px); }
        .rename-dialog h2 { margin-bottom: 7px; font-size: 18px; }
        .rename-dialog p { margin-bottom: 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
        .rename-input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: #0f172a;
            color: var(--text);
            font-size: 14px;
        }
        .rename-error { min-height: 19px; margin-top: 6px; color: #fca5a5; font-size: 12px; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 13px; }
        .dialog-actions button {
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #1e293b;
            cursor: pointer;
            font-size: 13px;
        }
        .dialog-actions .save-name { border-color: #4f46e5; background: #4f46e5; color: #fff; }
        .dialog-actions button:hover { filter: brightness(1.13); }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }
        @media (max-width: 700px) {
            .container {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
                gap: 10px;
                padding: 10px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
            .sidebar {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 8px;
                padding: 9px 11px;
                border-radius: 15px;
            }
            .sidebar-brand, .sidebar-label, .nav-item { display: none; }
            .profile-card {
                display: flex;
                min-width: 0;
                align-items: center;
                gap: 10px;
                padding: 0;
                border: 0;
                background: transparent;
                text-align: left;
            }
            .avatar { width: 42px; height: 42px; flex: 0 0 auto; margin: 0; border-radius: 13px; font-size: 23px; }
            .profile-info { min-width: 0; }
            .name-row { justify-content: flex-start; }
            .name { max-width: min(40vw, 180px); font-size: 15px; }
            .rename-btn { width: 25px; height: 25px; }
            .status { justify-content: flex-start; margin-top: 2px; font-size: 11px; }
            .sidebar-actions { display: flex; gap: 3px; margin: 0; padding: 0; }
            .action-btn { width: 36px; height: 36px; justify-content: center; padding: 0; }
            .action-label { display: none; }
            .chat-panel { border-radius: 15px; }
            .chat-header { min-height: 62px; padding: 11px 15px; }
            .chat-title { font-size: 15px; }
            .eyebrow { font-size: 9px; }
            .chat-header-actions { gap: 8px; }
            .proactive-control { gap: 5px; font-size: 10px; }
            .proactive-track { width: 32px; height: 19px; }
            .proactive-track::after { width: 13px; height: 13px; }
            .proactive-control input:checked + .proactive-track::after { transform: translateX(13px); }
            .connection-pill { padding: 6px 8px; font-size: 10px; }
            .chat-box { gap: 11px; padding: 16px 12px; }
            .message { max-width: 90%; padding: 10px 12px; font-size: 14px; }
            .composer { padding: 10px 10px max(11px, env(safe-area-inset-bottom)); }
            .composer-tools { margin-bottom: 8px; }
            .voice-choice { gap: 6px; font-size: 11px; }
            .voice-choice label { gap: 6px; }
            .voice-choice select { max-width: min(58vw, 250px); padding: 6px 24px 6px 8px; font-size: 11px; }
            .voice-preview-btn { padding: 6px 9px; font-size: 11px; }
            .input-hint { font-size: 10px; }
        }
        @media (max-width: 380px) {
            .voice-choice label { gap: 4px; }
            .voice-choice select { max-width: 48vw; }
            .connection-pill { gap: 5px; padding: 5px 6px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <aside class="sidebar" aria-label="陪伴空间导航">
            <div class="sidebar-brand">
                <span class="brand-icon" aria-hidden="true">✦</span>
                <span>陪伴空间</span>
            </div>
            <div class="profile-card">
                <div class="avatar" id="avatar" aria-hidden="true">⭐</div>
                <div class="profile-info">
                    <div class="name-row">
                        <div class="name" id="assistantName">荧</div>
                        <button class="rename-btn" id="renameNameBtn" type="button" title="修改名称" aria-label="修改 AI 名称">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15" aria-hidden="true">
                                <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="status">
                        <span class="status-dot"></span>
                        在线 · 你的陪伴伙伴
                    </div>
                </div>
            </div>
            <div class="sidebar-label">工作区</div>
            <div class="nav-item"><span aria-hidden="true">◉</span><span>当前对话</span></div>
            <div class="sidebar-actions">
                <button class="action-btn danger" onclick="clearChat()" title="清除聊天记录">
                    <span aria-hidden="true">⌫</span><span class="action-label">清除聊天记录</span>
                </button>
                <button class="action-btn" onclick="logout()" title="退出登录">
                    <span aria-hidden="true">↪</span><span class="action-label">退出登录</span>
                </button>
            </div>
        </aside>

        <section class="chat-panel" aria-label="聊天">
            <header class="chat-header">
                <div>
                    <span class="eyebrow">AI 陪伴 · 当前会话</span>
                    <h1 class="chat-title" id="chatTitle">与荧的对话</h1>
                </div>
                <div class="chat-header-actions">
                    <label class="proactive-control" for="proactiveToggle" title="允许 AI 在你一段时间没有聊天后主动发消息">
                        <span>主动对话</span>
                        <input id="proactiveToggle" type="checkbox" role="switch" aria-label="开启主动对话">
                        <span class="proactive-track" aria-hidden="true"></span>
                        <span id="proactiveStateLabel">已关闭</span>
                    </label>
                    <div class="connection-pill"><span class="status-dot"></span>在线</div>
                </div>
            </header>
            <div class="chat-box" id="chatBox" aria-live="polite">
                <div class="message bot">旅行者，你终于来啦~今天想和我聊什么呢？🌸</div>
            </div>
            <div class="composer">
                <div class="composer-tools">
                    <div class="voice-choice">
                        <label for="ttsVoice">
                            <span>语音</span>
                            <select id="ttsVoice" aria-label="选择回复语音">
                                <option value="">服务器默认（晓晓）</option>
                                <option value="zh-CN-XiaoxiaoNeural">晓晓（女声）</option>
                                <option value="zh-CN-XiaoyiNeural">晓伊（女声）</option>
                                <option value="zh-CN-YunxiNeural">云希（男声）</option>
                                <option value="zh-CN-YunyangNeural">云扬（男声）</option>
                                <option value="zh-CN-YunjianNeural">云健（男声）</option>
                                <option value="zh-CN-YunxiaNeural">云夏（男声）</option>
                                <option value="mimo-clone">我的合成声线（MiMo）</option>
                                <option value="ayaka-rvc">Ayaka_RVC（本地模型）</option>
                            </select>
                        </label>
                    </div>
                    <button class="voice-preview-btn" id="voicePreviewBtn" type="button" onclick="previewSelectedVoice()">试听</button>
                </div>
                <div class="voice-status" id="voiceStatus" role="status" aria-live="polite"></div>
                <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
                <div class="input-area">
                    <textarea id="userInput" placeholder="对荧说点什么吧..." autofocus rows="1"></textarea>
                    <button id="voiceInputBtn" type="button" onclick="toggleVoiceInput()" title="语音输入" aria-label="语音输入">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="19" height="19">
                            <rect x="9" y="2" width="6" height="12" rx="3"/>
                            <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/>
                        </svg>
                    </button>
                    <button id="sendBtn" onclick="sendMessage()" aria-label="发送消息" title="发送消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="19" height="19">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <dialog class="rename-dialog" id="renameDialog" aria-labelledby="renameTitle">
        <h2 id="renameTitle">修改 AI 名称</h2>
        <p>新名称会显示在聊天页面，并保存在当前账号的这台设备上。</p>
        <label class="sr-only" for="renameInput">AI 名称</label>
        <input class="rename-input" id="renameInput" type="text" maxlength="20" autocomplete="off" placeholder="输入名称">
        <div class="rename-error" id="renameError" role="status" aria-live="polite"></div>
        <div class="dialog-actions">
            <button type="button" id="cancelRenameBtn">取消</button>
            <button type="button" class="save-name" id="saveRenameBtn">保存</button>
        </div>
    </dialog>

    <script>
        const API_BASE = '';
        let abortController = null;
        let emotion = 'normal';
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let speechRecognition = null;
        let isVoiceInputActive = false;
        let hasRecognizedSpeech = false;

        const ttsVoiceSelect = document.getElementById('ttsVoice');
        const savedTtsVoice = localStorage.getItem('ttsVoice') || '';
        const availableTtsVoices = Array.from(ttsVoiceSelect.options)
            .map(option => option.value);
        ttsVoiceSelect.value = savedTtsVoice && availableTtsVoices.includes(savedTtsVoice)
            ? savedTtsVoice
            : 'zh-CN-XiaoxiaoNeural';
        ttsVoiceSelect.addEventListener('change', () => {
            localStorage.setItem('ttsVoice', ttsVoiceSelect.value);
        });

        async function toggleVoiceInput() {
            if (isVoiceInputActive && speechRecognition) {
                speechRecognition.stop();
                return;
            }
            if (!SpeechRecognition) {
                alert('当前浏览器不支持语音识别，请使用最新版 Chrome 或 Edge。');
                return;
            }
            if (!window.isSecureContext) {
                alert('浏览器语音识别需要安全连接。请在运行服务器的电脑上使用 http://127.0.0.1:8000，或配置 HTTPS。');
                return;
            }

            const button = document.getElementById('voiceInputBtn');
            const status = document.getElementById('voiceStatus');
            button.disabled = true;
            status.textContent = '正在检查麦克风...';
            let microphone;
            try {
                microphone = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphone.getTracks().forEach(track => track.stop());
            } catch (error) {
                const messages = {
                    'NotAllowedError': '麦克风权限被浏览器或系统拒绝。检查地址栏网站权限及系统的麦克风隐私设置。',
                    'NotFoundError': '系统没有找到麦克风，请检查输入设备是否连接。',
                    'NotReadableError': '麦克风正被其他程序占用，或系统无法读取它。'
                };
                status.textContent = messages[error.name] || `麦克风检查失败：${error.name}`;
                button.disabled = false;
                return;
            }

            speechRecognition = new SpeechRecognition();
            hasRecognizedSpeech = false;
            speechRecognition.lang = 'zh-CN';
            speechRecognition.continuous = false;
            speechRecognition.interimResults = true;
            speechRecognition.onstart = () => {
                isVoiceInputActive = true;
                button.disabled = false;
                status.textContent = '正在听，请对着麦克风说话...';
                button.classList.add('mic-listening');
                button.title = '停止语音输入';
                button.setAttribute('aria-label', '停止语音输入');
            };
            speechRecognition.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                hasRecognizedSpeech = Boolean(transcript.trim());
                userInput.value = transcript;
                userInput.dispatchEvent(new Event('input'));
                userInput.focus();
                status.textContent = '已识别，请检查文字后发送。';
            };
            speechRecognition.onerror = (event) => {
                const messages = {
                    'service-not-allowed': '浏览器语音识别服务不可用。',
                    'not-allowed': '浏览器语音识别服务无法启动，请稍后重试。',
                    'network': '语音识别服务连接失败，请检查网络。',
                    'no-speech': '麦克风权限正常，但识别服务没有收到可识别的声音。请检查系统输入设备和麦克风音量，靠近麦克风再试。'
                };
                if (event.error !== 'aborted' && !hasRecognizedSpeech) {
                    status.textContent = messages[event.error] || `语音识别失败：${event.error}`;
                }
            };
            speechRecognition.onend = () => {
                isVoiceInputActive = false;
                button.disabled = false;
                button.classList.remove('mic-listening');
                button.title = '语音输入';
                button.setAttribute('aria-label', '语音输入');
            };
            try {
                speechRecognition.start();
            } catch (error) {
                isVoiceInputActive = false;
                button.disabled = false;
                status.textContent = `无法启动语音输入：${error.message}`;
            }
        }

        // 认证相关
        function getToken() {
            return localStorage.getItem('token');
        }

        function getUser() {
            const user = localStorage.getItem('user');
            return user ? JSON.parse(user) : null;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // 检查登录状态
        if (!getToken()) {
            window.location.href = '/login.html';
        }

        function getUserId() {
            const user = getUser();
            return user ? String(user.id) : 'default';
        }

        const assistantName = document.getElementById('assistantName');
        const chatTitle = document.getElementById('chatTitle');
        const renameDialog = document.getElementById('renameDialog');
        const renameInput = document.getElementById('renameInput');
        const renameError = document.getElementById('renameError');
        const assistantNameStorageKey = `assistantName:${getUserId()}`;

        function applyAssistantName(name) {
            assistantName.textContent = name;
            chatTitle.textContent = `与${name}的对话`;
            document.getElementById('userInput').placeholder = `对${name}说点什么吧...`;
            document.title = `${name} - 我的陪伴空间`;
        }

        applyAssistantName(localStorage.getItem(assistantNameStorageKey) || '荧');

        document.getElementById('renameNameBtn').addEventListener('click', () => {
            renameInput.value = assistantName.textContent;
            renameError.textContent = '';
            renameDialog.showModal();
            renameInput.focus();
            renameInput.select();
        });

        document.getElementById('cancelRenameBtn').addEventListener('click', () => {
            renameDialog.close();
        });

        function saveAssistantName() {
            const name = renameInput.value.trim();
            if (!name) {
                renameError.textContent = '名称不能为空。';
                renameInput.focus();
                return;
            }

            try {
                localStorage.setItem(assistantNameStorageKey, name);
            } catch (error) {
                renameError.textContent = '保存失败，请检查浏览器的本地存储设置后重试。';
                return;
            }

            applyAssistantName(name);
            renameDialog.close();
        }

        document.getElementById('saveRenameBtn').addEventListener('click', saveAssistantName);
        renameInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                saveAssistantName();
            }
        });

        // 带认证的fetch
        async function authFetch(url, options = {}) {
            const token = getToken();
            if (!token) {
                logout();
                return null;
            }

            options.headers = options.headers || {};
            options.headers['Authorization'] = `Bearer ${token}`;

            const resp = await fetch(url, options);

            if (resp.status === 401) {
                logout();
                return null;
            }

            return resp;
        }

        function addMessage(text, className, messageId = null) {
            const chatBox = document.getElementById('chatBox');
            const cleanedText = (text || '')
                .replace(/\[当前用户情绪:[^\]]+\]\s*/g, '')
                .replace(/\*[^*]*\*/g, '')
                .trim();

            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.textContent = cleanedText || ' ';

            // 添加删除按钮
            if (messageId) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-msg-btn';
                deleteBtn.textContent = '×';
                deleteBtn.onclick = async () => {
                    if (confirm('确定删除这条消息？')) {
                        try {
                            await authFetch(`${API_BASE}/api/history/${messageId}`, { method: 'DELETE' });
                            div.remove();
                        } catch(e) {
                            console.error('删除失败:', e);
                        }
                    }
                };
                div.appendChild(deleteBtn);
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function showTyping() {
            const chatBox = document.getElementById('chatBox');
            if (document.querySelector('.typing-indicator')) return;
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            const el = document.querySelector('.typing-indicator');
            if (el) el.remove();
        }

        function setSending(sending) {
            const btn = document.getElementById('sendBtn');
            if (sending) {
                btn.classList.add('sending');
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
                btn.onclick = abortRequest;
            } else {
                btn.classList.remove('sending');
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
                btn.onclick = sendMessage;
            }
        }

        function abortRequest() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            hideTyping();
            setSending(false);
        }

        function cleanTTS(text){

            return text
                // 删除中文括号动作
                .replace(/（.*?）/g,'')

                // 删除英文括号动作
                .replace(/\(.*?\)/g,'')

                // 删除星号动作（但保留情绪标记供后端解析）
                .replace(/\*[^*]*\*/g,'')

                .trim();
        }

        // 解析情绪标记
        function parseEmotion(text) {
            const emotionMarkers = {
                'happy': ['happy', '开心', '高兴', '兴奋', 'excited', '喜悦'],
                'sad': ['sad', '难过', '伤心', '悲伤', 'depressed', '沮丧'],
                'angry': ['angry', '生气', '愤怒', 'mad', '恼怒'],
                'gentle': ['gentle', '温柔', '轻声', 'soft', '柔和'],
                'shy': ['shy', '害羞', '羞涩', 'embarrassed', '腼腆'],
                'normal': ['normal', '平静', '自然', '淡定'],
            };

            // 匹配 *emotion* 格式的标记
            const match = text.match(/\*([^*]+)\*/);
            if (match) {
                const marker = match[1].toLowerCase();
                for (const [emotion, keywords] of Object.entries(emotionMarkers)) {
                    if (keywords.some(k => k.toLowerCase() === marker)) {
                        return emotion;
                    }
                }
            }
            return 'normal';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || abortController) return;

            addMessage(text, 'user');
            input.value = '';
            showTyping();
            setSending(true);

            abortController = new AbortController();
            console.log('发送消息:', text);

            try {
                const resp = await authFetch(API_BASE + '/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, user_id: getUserId() }),
                    signal: abortController.signal,
                });

                if (!resp) {
                    hideTyping();
                    console.log('authFetch返回null');
                    return;
                }

                // 检查响应状态
                if (!resp.ok) {
                    hideTyping();
                    console.error('请求失败:', resp.status, resp.statusText);
                    addMessage('抱歉，我现在有点累，能再说一遍吗？', 'bot');
                    return;
                }

                console.log('收到响应，开始读取流');
                hideTyping();
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let botMsg = addMessage('', 'bot');
                let fullReply = '';
                let buffer = '';
                let ttsTriggered = false;  // 是否已触发 TTS

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        console.log('流结束');
                        break;
                    }
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    fullReply += parsed.content;
                                    const cleaned = fullReply
                                        .replace(/\[当前用户情绪:[^\]]+\]\s*/g, '')
                                        .replace(/\*[^*]*\*/g, '')
                                        .trim();
                                    botMsg.innerHTML = cleaned ? cleaned.replace(/</g, '&lt;') : '&nbsp;';
                                    console.log('收到内容:', parsed.content);
                                }
                            } catch (e) {
                                // 如果JSON解析失败，尝试直接使用数据
                                if (data && data !== '[DONE]') {
                                    fullReply += data;
                                    const cleaned = fullReply
                                        .replace(/\[当前用户情绪:[^\]]+\]\s*/g, '')
                                        .replace(/\*[^*]*\*/g, '')
                                        .trim();
                                    botMsg.innerHTML = cleaned ? cleaned.replace(/</g, '&lt;') : '&nbsp;';
                                    console.log('JSON解析失败，使用原始数据:', data);
                                }
                            }
                        }
                    }
                }

                console.log('完整回复:', fullReply);

                // 如果流结束后仍然没有内容，显示默认消息
                if (!fullReply.trim()) {
                    botMsg.innerHTML = '嗯，我在听，你继续说~';
                    fullReply = '嗯，我在听，你继续说~';
                    console.log('没有收到内容，使用默认消息');
                }

                // 等整段话生成完毕后，一次性播放 TTS
                if (fullReply.trim() && !ttsTriggered) {
                    ttsTriggered = true;
                    // 解析情绪标记
                    const emotion = parseEmotion(fullReply);
                    // 清理文本（移除括号内容，但保留情绪标记供后端解析）
                    const cleanText = cleanTTS(fullReply);
                    try {
                        playTTS(cleanText, emotion);
                    } catch (ttsError) {
                        console.warn('TTS播放失败:', ttsError);
                    }
                }

            } catch (error) {
                if (error.name !== 'AbortError') {
                    hideTyping();
                    console.error('聊天请求失败:', error.name, error.message);
                    // 显示错误消息
                    addMessage('抱歉，出了点问题，请再试一次~', 'bot');
                }
            } finally {
                abortController = null;
                setSending(false);
            }
        }


        // ── 清除聊天记录 ──────────────────────────────
        async function clearChat() {
            if (!confirm('确定要清除所有聊天记录吗？')) return;

            try {
                await authFetch(
                    `${API_BASE}/api/history?user_id=${encodeURIComponent(getUserId())}`,
                    { method: 'DELETE' }
                );
                // 重置聊天界面
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = '<div class="message bot">旅行者，你终于来啦~今天想和我聊什么呢？🌸</div>';
            } catch(e) {
                addMessage('嗯？出了点小问题，再试一次吧~', 'bot');
            }
        }

        // ── TTS 语音合成播放 ──────────────────────
        let currentAudio = null;  // 当前播放的音频
        let previewAudio = null;
        let previewAbortController = null;
        let audioUnlocked = false;  // 浏览器音频解锁状态
        let ttsQueue = [];  // TTS 播放队列
        let isPlayingTTS = false;  // 是否正在播放 TTS

        // 解锁浏览器音频（需要用户交互后才能自动播放）
        function unlockAudio() {
            if (audioUnlocked) return;
            const silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=');
            silent.play().then(() => {
                audioUnlocked = true;
                console.log('音频已解锁');
            }).catch(() => {});
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
        }
        document.addEventListener('click', unlockAudio);
        document.addEventListener('keydown', unlockAudio);

        async function previewSelectedVoice() {
            const button = document.getElementById('voicePreviewBtn');
            const status = document.getElementById('voiceStatus');
            if (previewAbortController) {
                previewAbortController.abort();
                if (previewAudio) previewAudio.pause();
                status.textContent = '试听已停止。';
                return;
            }

            const controller = new AbortController();
            const voice = ttsVoiceSelect.value;
            previewAbortController = controller;
            button.textContent = '停止试听';
            status.textContent = '正在生成试听语音...';

            let audioUrl = '';
            try {
                const resp = await authFetch(API_BASE + '/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: '你好呀，这是当前语音的试听。',
                        emotion: 'normal',
                        voice,
                    }),
                    signal: controller.signal,
                });
                if (controller.signal.aborted) return;
                if (!resp) {
                    throw new Error('登录状态已失效，请重新登录后试听。');
                }
                if (!resp.ok) {
                    let errorMessage = `HTTP ${resp.status}`;
                    try {
                        const errorBody = await resp.json();
                        if (errorBody.error) errorMessage = errorBody.error;
                    } catch(e) {}
                    throw new Error(errorMessage);
                }

                const blob = await resp.blob();
                if (!blob.size) throw new Error('服务器返回了空音频。');
                if (controller.signal.aborted) return;

                audioUrl = URL.createObjectURL(blob);
                previewAudio = new Audio(audioUrl);
                status.textContent = '正在试听...';
                await new Promise((resolve, reject) => {
                    const onAbort = () => reject(new DOMException('试听已停止', 'AbortError'));
                    controller.signal.addEventListener('abort', onAbort, { once: true });
                    previewAudio.onended = resolve;
                    previewAudio.onerror = () => reject(new Error('音频播放失败，请检查设备音量。'));
                    previewAudio.play().catch(reject);
                });
                if (!controller.signal.aborted) {
                    status.textContent = '试听完成。';
                    setTimeout(() => {
                        if (status.textContent === '试听完成。') status.textContent = '';
                    }, 2500);
                }
            } catch(e) {
                if (e.name !== 'AbortError') {
                    console.warn('语音试听失败:', e.message);
                    status.textContent = `试听失败：${e.message}`;
                }
            } finally {
                if (previewAudio) {
                    previewAudio.pause();
                    previewAudio = null;
                }
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                if (previewAbortController === controller) {
                    previewAbortController = null;
                    button.textContent = '试听';
                }
            }
        }

        // 处理 TTS 播放队列
        async function processTTSQueue() {
            if (isPlayingTTS || ttsQueue.length === 0) return;
            isPlayingTTS = true;
            const status = document.getElementById('voiceStatus');

            while (ttsQueue.length > 0) {
                const item = ttsQueue.shift();
                const text = item.text;
                const emotion = item.emotion || 'normal';
                if (!text.trim()) continue;

                try {
                    const resp = await authFetch(API_BASE + '/api/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: text,
                            emotion: emotion,
                            voice: item.voice,
                        }),
                    });

                    if (!resp || !resp.ok) {
                        console.warn('TTS 请求失败:', resp ? resp.status : 'no response');
                        let errorMessage = `HTTP ${resp ? resp.status : '无响应'}`;
                        if (resp) {
                            try {
                                const errorBody = await resp.json();
                                if (errorBody.error) errorMessage = errorBody.error;
                            } catch(e) {}
                        }
                        status.textContent = `语音合成失败：${errorMessage}`;
                        continue;
                    }

                    const contentType = resp.headers.get('Content-Type') || '';
                    if (contentType.includes('audio/')) {
                        const blob = await resp.blob();
                        if (blob.size === 0) {
                            status.textContent = '语音合成失败：服务器返回了空音频。';
                            continue;
                        }

                        const url = URL.createObjectURL(blob);
                        await new Promise((resolve) => {
                            let settled = false;
                            const finish = (errorMessage = '') => {
                                if (settled) return;
                                settled = true;
                                URL.revokeObjectURL(url);
                                currentAudio = null;
                                if (errorMessage) {
                                    status.textContent = `语音播放失败：${errorMessage}`;
                                } else if (status.textContent.startsWith('语音')) {
                                    status.textContent = '';
                                }
                                resolve();
                            };
                            currentAudio = new Audio(url);
                            currentAudio.onended = () => finish();
                            currentAudio.onerror = (e) => {
                                console.warn('音频播放错误:', e);
                                finish('检查浏览器音量或音频播放权限');
                            };
                            currentAudio.play().catch(e => {
                                console.warn('播放被阻止:', e.message);
                                finish('浏览器阻止了播放，请点击页面后重试');
                            });
                        });
                    } else {
                        status.textContent = '语音合成失败：服务器返回的不是音频。';
                    }
                } catch(e) {
                    console.warn('TTS 失败:', e.message);
                }
            }

            isPlayingTTS = false;
        }

        function playTTS(text, emotion = 'normal') {
            if (!text) return;
            ttsQueue.push({ text, emotion, voice: ttsVoiceSelect.value });
            processTTSQueue();
        }

        async function loadHistory() {
            try {
                console.log('开始加载历史记录...');
                const resp = await authFetch(
                    `${API_BASE}/api/history?user_id=${encodeURIComponent(getUserId())}`
                );
                if (!resp) {
                    console.log('authFetch返回null');
                    return;
                }

                console.log('响应状态:', resp.status);
                const data = await resp.json();
                console.log('消息数量:', data.messages ? data.messages.length : 0);

                if (data.messages && data.messages.length > 0) {
                    // 清除默认欢迎消息
                    const chatBox = document.getElementById('chatBox');
                    chatBox.innerHTML = '';
                    // 逐条显示历史消息
                    for (const msg of data.messages) {
                        console.log('显示消息:', msg.role, msg.content.substring(0, 20));
                        if (msg.role === 'user') {
                            addMessage(msg.content, 'user', msg.id);
                        } else if (msg.role === 'assistant') {
                            addMessage(msg.content, 'bot', msg.id);
                        }
                    }
                }
            } catch(e) {
                console.error('加载历史记录失败:', e);
            }
        }

        const userInput = document.getElementById('userInput');

        // 自动调整高度
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
                // 重置高度
                this.style.height = 'auto';
            }
        });

        userInput.focus();

        // 启动时加载历史
        loadHistory();

        // ── 主动对话开关与轮询 ─────────────────────────
        let proactivePolling = null;
        let proactiveAbortController = null;
        let proactiveRequestPending = false;
        const proactiveToggle = document.getElementById('proactiveToggle');
        const proactiveStateLabel = document.getElementById('proactiveStateLabel');
        const proactiveStorageKey = `proactiveEnabled:${getUserId()}`;

        async function checkProactiveMessage() {
            if (!proactiveToggle.checked || proactiveRequestPending) return;

            proactiveRequestPending = true;
            proactiveAbortController = new AbortController();
            try {
                const resp = await authFetch(
                    `${API_BASE}/api/proactive`,
                    { signal: proactiveAbortController.signal }
                );
                if (!resp) return;

                const data = await resp.json();
                if (data.has_message && data.message && proactiveToggle.checked) {
                    addMessage(data.message, 'bot');
                    playTTS(data.message, 'normal');
                }
            } catch(error) {
                if (error.name !== 'AbortError') {
                    console.error('检查主动消息失败:', error);
                }
            } finally {
                proactiveAbortController = null;
                proactiveRequestPending = false;
            }
        }

        function setProactiveEnabled(enabled, persist = true) {
            proactiveToggle.checked = enabled;
            proactiveStateLabel.textContent = enabled ? '已开启' : '已关闭';
            if (persist) {
                localStorage.setItem(proactiveStorageKey, String(enabled));
            }

            if (proactivePolling) {
                clearInterval(proactivePolling);
                proactivePolling = null;
            }
            if (!enabled) {
                if (proactiveAbortController) proactiveAbortController.abort();
                return;
            }

            checkProactiveMessage();
            proactivePolling = setInterval(checkProactiveMessage, 30000);
        }

        proactiveToggle.addEventListener('change', () => {
            setProactiveEnabled(proactiveToggle.checked);
        });
        setProactiveEnabled(localStorage.getItem(proactiveStorageKey) === 'true', false);

        function updateEmotionLocal() {
            // 简单的情绪更新（前端本地）
            // 实际情绪由后端管理
        }
    </script>
</body>
</html>
